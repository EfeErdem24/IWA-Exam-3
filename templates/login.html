{% extends 'base.html' %}

{% block title %}Account Access - Erdem Cooking School{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-12 col-md-8 col-lg-6">
    
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
      
      <div class="card-header bg-dark text-white p-4 text-center">
        <div class="d-inline-flex align-items-center justify-content-center bg-warning text-dark rounded-circle mb-3 auth-icon-circle">
          <i class="bi bi-person-fill-lock fs-3"></i>
        </div>
        <h1 class="h4 fw-bold mb-1">Erdem Cooking School</h1>
      </div>

      <div class="bg-light px-4 pt-3 border-bottom">
        <ul class="nav nav-pills nav-fill" id="authTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link auth-pill {% if activeTab != 'register' %}active{% endif %} rounded-pill py-2" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button" role="tab" aria-controls="loginPane" aria-selected="{% if activeTab != 'register' %}true{% else %}false{% endif %}">
              <i class="bi bi-box-arrow-in-right me-1"></i> Log In
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link auth-pill {% if activeTab == 'register' %}active{% endif %} rounded-pill py-2 ms-2" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button" role="tab" aria-controls="registerPane" aria-selected="{% if activeTab == 'register' %}true{% else %}false{% endif %}">
              <i class="bi bi-person-plus-fill me-1"></i> Sign Up
            </button>
          </li>
        </ul>
      </div>

      <div class="card-body p-4 p-md-5">
        <div class="tab-content" id="authTabContent">

          <div class="tab-pane fade {% if activeTab != 'register' %}show active{% endif %}" id="loginPane" role="tabpanel" aria-labelledby="login-tab">
            <form action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" method="POST" novalidate>
              
              <div class="mb-3">
                <label for="loginEmail" class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" class="form-control" id="loginEmail" name="email" value="{{ email or '' }}" placeholder="Enter your email" required autofocus>
                </div>
              </div>

              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                  <label for="loginPassword" class="form-label fw-semibold mb-0">Password</label>
                </div>
                <div class="input-group mt-1">
                  <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                  <input type="password" class="form-control" id="loginPassword" name="password" placeholder="Enter your password" required>
                </div>
              </div>

              <button type="submit" class="btn btn-warning w-100 py-2 fw-bold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-2"></i> Log In
              </button>
            </form>
          </div>

          <div class="tab-pane fade {% if activeTab == 'register' %}show active{% endif %}" id="registerPane" role="tabpanel" aria-labelledby="register-tab">
            <form action="{{ url_for('register') }}" method="POST" novalidate>
              
              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label for="regFirstName" class="form-label fw-semibold">First Name</label>
                  <input type="text" class="form-control" id="regFirstName" name="firstName" value="{{ firstName or '' }}" placeholder="First name" minlength="2" required>
                </div>
                <div class="col-md-6">
                  <label for="regLastName" class="form-label fw-semibold">Last Name</label>
                  <input type="text" class="form-control" id="regLastName" name="lastName" value="{{ lastName or '' }}" placeholder="Last name" minlength="2" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="regEmail" class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" class="form-control" id="regEmail" name="email" value="{{ email or '' }}" placeholder="e.g. yourname@domain.com" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="regPassword" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" class="form-control" id="regPassword" name="password" minlength="6" placeholder="At least 6 characters" required>
                </div>
              </div>

              <div class="mb-4">
                <label for="regConfirmPassword" class="form-label fw-semibold">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-check2-circle text-muted"></i></span>
                  <input type="password" class="form-control" id="regConfirmPassword" name="confirmPassword" minlength="6" placeholder="Re-enter password" required>
                </div>
              </div>

              <button type="submit" class="btn btn-warning w-100 py-2 fw-bold shadow-sm">
                <i class="bi bi-person-check-fill me-2"></i> Complete Registration
              </button>
            </form>
          </div>

        </div>
      </div>

    </div>

  </div>
</div>

{% endblock %}
